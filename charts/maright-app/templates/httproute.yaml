{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "maright-app.fullname" . }}
  labels:
    {{- include "maright-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
  hostnames:
    {{- toYaml .Values.route.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "maright-app.fullname" . }}
          port: {{ .Values.service.port }}
      {{- with .Values.route.timeout }}
      timeouts:
        request: {{ . }}
      {{- end }}
{{- end }}
