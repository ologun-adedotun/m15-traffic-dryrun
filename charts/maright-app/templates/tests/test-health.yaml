apiVersion: v1
kind: Pod
metadata:
  name: {{ include "maright-app.fullname" . }}-test-health
  labels:
    {{- include "maright-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        - "import urllib.request; r = urllib.request.urlopen('http://{{ include "maright-app.fullname" . }}:{{ .Values.service.port }}/health', timeout=5); assert r.status == 200; print('health ok')"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
