apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mission-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Mission Control Lab CA
  secretName: mission-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mission-ca
spec:
  ca:
    secretName: mission-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mission-tls
  namespace: infra
spec:
  secretName: mission-tls
  dnsNames:
    - mission.local
  issuerRef:
    name: mission-ca
    kind: ClusterIssuer
